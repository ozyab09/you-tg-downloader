version: 2

updates:
  # Python-зависимости (requirements*.txt)
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  # Docker-образ (Dockerfile: python, ffmpeg, deno)
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope

  # GitHub Actions (actions/checkout, setup-python)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
