services:
  bot:
    build: .
    container_name: ytbot
    env_file: .env
    restart: unless-stopped
    stop_grace_period: 30s
    tmpfs:
      - /dev/shm:size=1g
    # Код монтируется с хоста: правки применяются через `docker compose restart bot`
    # (без пересборки образа). Watchfiles не используем: автоперезапуск посреди
    # загрузки роняет активные задачи.
    volumes:
      - ./app:/app/app:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
