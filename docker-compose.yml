services:
  # Локальный Bot API Server: лимит файла 2 ГБ вместо 50 МБ.
  # Включается через профиль local + TELEGRAM_API_ID/HASH в .env:
  #   docker compose --profile local up -d
  # Без профиля бот работает через облачный api.telegram.org (лимит 50 МБ).
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    container_name: telegram-bot-api
    restart: unless-stopped
    profiles: ["local"]
    environment:
      # Подставляются из .env; сервис активен только с профилем local:
      #   docker compose --profile local up -d
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_LOCAL: 1
      TELEGRAM_STAT: 1
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  bot:
    build: .
    container_name: ytbot
    env_file: .env
    restart: unless-stopped
    stop_grace_period: 30s
    tmpfs:
      - /dev/shm:size=1g
    depends_on:
      telegram-bot-api:
        condition: service_healthy
        required: false
    # Код приложения монтируется с хоста (read-only): правки применяются
    # без пересборки образа — watchfiles перезапускает процесс сам.
    volumes:
      - ./app:/app/app:ro
    command: ["watchfiles", "python -m app.main", "/app/app"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  telegram-bot-api-data:
