services:
  bot:
    build: .
    container_name: ytbot
    env_file: .env
    restart: unless-stopped
    stop_grace_period: 30s
    tmpfs:
      - /dev/shm:size=1g
    # Код приложения монтируется с хоста (read-only): правки применяются
    # без пересборки образа — watchfiles перезапускает процесс сам.
    volumes:
      - ./app:/app/app:ro
    command: ["watchfiles", "python -m app.main", "/app/app"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
